# herdr configuration
# https://herdr.dev/docs/configuration/

onboarding = false

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false

[theme]
name = "solarized"
auto_switch = false

[keys]
# Default prefix, unchanged. Press prefix, release, then the action key.
prefix = "ctrl+b"
navigate_workspace_up = "k"
navigate_workspace_down = "j"

# prefix+? opens the live keybinding panel (herdr's which-key equivalent) —
# built in, no extra config needed.
help = "prefix+?"
