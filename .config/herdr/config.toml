# herdr configuration
# https://herdr.dev/docs/configuration/

onboarding = false

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false

[theme]
name = "terminal"
auto_switch = false

# The terminal theme draws the focused tab label in surface_dim (ANSI DarkGray,
# #6e7681) on the accent (ANSI Blue, #58a6ff): 1.8:1, unreadable. The GitHub Dark
# background raises it to 7.5:1. surface_dim also tints the unfocused scrollbar
# track and the selection base.
[theme.custom]
surface_dim = "#0d1117"

[keys]
# Default prefix, unchanged. Press prefix, release, then the action key.
prefix = "ctrl+space"
navigate_workspace_up = "k"
navigate_workspace_down = "j"

# prefix+? opens the live keybinding panel (herdr's which-key equivalent) —
# built in, no extra config needed.
help = "prefix+?"

[[keys.command]]
key = "prefix+P"
type = "plugin_action"
command = "pet.toggle"
description = "pet: toggle"

[[keys.command]]
key = "prefix+O"
type = "plugin_action"
command = "pet.settings"
description = "pet: settings"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "plugins: manager"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "usagebar.open-limits"
description = "agents: usage limits"

# Sidebar rows for the Agent Usage plugin (senna-lang/herdr-agent-usage).
# Colors follow the GitHub Dark palette: yellow for mid cache hit, red for low.
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "$title"],
  ["$provider", "$limit"],
  ["$cache_high", { token = "$cache_mid", fg = "#e3b341" }, { token = "$cache_low", fg = "#ff7b72" }],
  ["$context"],
]
