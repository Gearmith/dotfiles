# ~/.config/kitty/kitty.conf
# Catppuccin Mocha accents (matching Neovim) over Ubuntu's aubergine
# background, with a transparent window to match `transparent_background = true`
# in colors.lua.

# ── Font ──────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# ── Shell ─────────────────────────────────────────────────────────────
shell fish
shell_integration enabled

# ── Window ────────────────────────────────────────────────────────────
background_opacity    0.90
background_blur       32
window_padding_width   6
confirm_os_window_close 0

# ── Tab bar ───────────────────────────────────────────────────────────
tab_bar_edge            bottom
tab_bar_style            powerline
tab_powerline_style      round

# ── Scrollback ────────────────────────────────────────────────────────
scrollback_lines 10000

# ── Cursor ────────────────────────────────────────────────────────────
cursor_shape           beam
cursor_blink_interval   0

# ── Mouse / misc ──────────────────────────────────────────────────────
copy_on_select    yes
enable_audio_bell no
update_check_interval 0

# ── Colors: Catppuccin Mocha accents, Ubuntu aubergine background ────
foreground              #CDD6F4
background              #300A24
selection_foreground    #300A24
selection_background    #F5E0DC

cursor                  #F5E0DC
cursor_text_color       #300A24

url_color               #F5E0DC

active_border_color     #B4BEFE
inactive_border_color   #6C7086
bell_border_color       #F9E2AF

active_tab_foreground   #11111B
active_tab_background   #CBA6F7
inactive_tab_foreground #CDD6F4
inactive_tab_background #3D1330
tab_bar_background      #240718

# black
color0  #45475A
color8  #585B70
# red
color1  #F38BA8
color9  #F38BA8
# green
color2  #A6E3A1
color10 #A6E3A1
# yellow
color3  #F9E2AF
color11 #F9E2AF
# blue
color4  #89B4FA
color12 #89B4FA
# magenta
color5  #F5C2E7
color13 #F5C2E7
# cyan
color6  #94E2D5
color14 #94E2D5
# white
color7  #BAC2DE
color15 #A6ADC8

# ── macOS specific ────────────────────────────────────────────────────
macos_titlebar_color        system
macos_option_as_alt         yes
macos_quit_when_last_window_closed yes

# ── Machine-local overrides (not tracked) ─────────────────────────────
globinclude local.conf
